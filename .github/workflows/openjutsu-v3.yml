name: Build NWTIA OpenJutsu V3

on:
  push:
    branches: [main]
    paths:
      - 'openjutsu-v3/**'
      - '.github/workflows/openjutsu-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Test authenticated chunk transport without a GPU
        run: |
          python3 -m venv "$RUNNER_TEMP/upload-tests"
          "$RUNNER_TEMP/upload-tests/bin/pip" install aiohttp
          export NWTIA_BOOTSTRAP="$PWD/openjutsu-v3/bootstrap.py"
          "$RUNNER_TEMP/upload-tests/bin/python" openjutsu-v3/test_web_access.py
          "$RUNNER_TEMP/upload-tests/bin/python" openjutsu-v3/test_chunk_upload.py
      - name: Validate unchanged GPU runtime and build the updated web app
        run: python3 openjutsu-v3/build_upload_frontend.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: openjutsu-v3
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nwtia-runpod-openjutsu-v3:latest
            ghcr.io/${{ github.repository_owner }}/nwtia-runpod-openjutsu-v3:${{ github.sha }}
