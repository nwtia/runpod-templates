name: Build NWTIA OpenJutsu V3

on:
  push:
    branches: [main]
    paths:
      - 'openjutsu-v3/**'
      - '.github/workflows/openjutsu-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: openjutsu-v3
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nwtia-runpod-openjutsu-v3:latest
            ghcr.io/${{ github.repository_owner }}/nwtia-runpod-openjutsu-v3:${{ github.sha }}
          cache-from: type=gha,scope=openjutsu-v3
          cache-to: type=gha,mode=max,scope=openjutsu-v3
